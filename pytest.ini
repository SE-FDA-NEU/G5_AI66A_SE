# One command runs every backend test from the repository root: `pytest` (docs/SETUP.md,
# section 7). backend/pytest.ini does the same when pytest is run from backend/.
# No test starts a server or opens backend/expense.db: each builds its own database in memory
# or in a temporary folder (backend/tests/conftest.py).
[pytest]
testpaths = backend/tests
pythonpath = backend
addopts = -ra
