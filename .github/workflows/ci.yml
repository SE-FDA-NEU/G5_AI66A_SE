name: CI

# The pipeline of docs/operations.md, section 2. Every push and every pull request into main runs
# the four check jobs side by side on fresh Ubuntu machines; a push to main that passes all four
# then deploys to Render. Nothing reaches the URL that did not pass here first.
#
#   push / PR ─┬─ Python tests ───────────────┐
#              ├─ Python tests on PostgreSQL ─┤
#              ├─ Node build and tests ───────┼─ (push to main only) ─ Deploy to Render
#              └─ No secrets committed ───────┘
#
# Target: the whole run in under 2 minutes (it takes about one). Each check job stops after 3
# minutes, so a hung test turns red instead of keeping a pull request waiting.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# A newer push to the same branch cancels the run still going, so the team only waits for the
# latest commit and the org's Actions minutes are not spent twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # The same Python as backend/.python-version and Render. The pip cache makes the install
      # take seconds instead of a minute.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Cheapest first: a style or syntax error fails here in seconds, before any test runs.
      - name: Lint
        run: ruff check . --output-format=github

      - name: Migrations match the models
        # Builds a throwaway database from the migrations, then fails if a model changed
        # without a migration to match it.
        env:
          DATABASE_URL: sqlite:///./ci-check.db
        run: |
          alembic upgrade head
          alembic check

      - name: Test
        run: pytest -q --cov=app --cov-report=term --junitxml=junit.xml

      - name: One command from the repository root
        # docs/SETUP.md, section 7: the instructor types `pytest` in the cloned folder. This
        # proves that command finds every test, on a machine that has never seen the project.
        working-directory: .
        run: pytest -q

      - name: Publish test summary
        if: always()
        run: |
          echo "### Test results" >> "$GITHUB_STEP_SUMMARY"
          python - << 'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET, pathlib
          f = pathlib.Path("junit.xml")
          if not f.exists():
              print("No test report produced. Did the test run crash?")
          else:
              r = ET.parse(f).getroot()
              s = r if r.tag == "testsuite" else r.find("testsuite")
              total = int(s.get("tests", 0))
              bad = int(s.get("failures", 0)) + int(s.get("errors", 0))
              print(f"- Tests run: **{total}**")
              print(f"- Failed: **{bad}**")
              print(f"- Skipped: **{s.get('skipped', 0)}**")
              print(f"- Time: **{float(s.get('time', 0)):.1f} s**")
          PY

  postgres:
    name: Python tests on PostgreSQL
    # The URL runs on PostgreSQL (ADR 4), the laptops on SQLite. The same tests run here against
    # a real PostgreSQL, so a difference between the two fails a pull request, not the live app.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: g5
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: expense
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U g5" --health-interval 2s --health-timeout 2s
          --health-retries 15
    env:
      # A throwaway database inside this job; the password exists only here.
      DATABASE_URL: postgresql://g5:ci-only@localhost:5432/expense
      TEST_DATABASE_URL: postgresql+psycopg://g5:ci-only@localhost:5432/expense
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Migrations run on PostgreSQL and match the models
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base

      - name: Test
        run: pytest -q

      - name: The start script seeds PostgreSQL, twice without adding anything
        run: |
          python -m scripts.seed_data
          python -m scripts.seed_data | tee seed.txt
          grep -q "transactions  91" seed.txt

  node:
    name: Node build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # npm ci installs exactly what package-lock.json lists, so CI runs the versions we ran.
      - run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test -- --ci

      # The same command Render runs for the static site. A screen that does not compile fails
      # here, on the pull request, instead of on Render after the merge.
      - name: Build the web app
        run: npm run build

  secrets:
    name: No secrets committed
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for obvious credentials
        run: |
          # Deliberately simple and readable - students should be able to read this
          # and understand why their commit was blocked.
          PATTERN='(AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|-----BEGIN [A-Z ]*PRIVATE KEY-----|password\s*=\s*["'"'"'][^"'"'"']{6,}|postgres(ql)?://[^:/ ]+:[^@ ]{8,}@[^ ]*neon\.tech)'
          if git grep -nIE "$PATTERN" -- . ':!*.md' ':!.github/workflows/*' ; then
            echo "::error::A credential-looking string was found. Move it to an environment variable and rotate the key."
            exit 1
          fi
          echo "Clean."

      - name: No blank left to fill in the documents
        # The handoff drafts mark what only the team can write, such as a review count, with ⟦...⟧.
        # In Sprint 4 one such line reached main unfilled (docs/retro.md); now it cannot.
        run: |
          if git grep -n "⟦" -- README.md docs ; then
            echo "::error::A blank marked ⟦...⟧ is still in the documents. Fill it in before merging."
            exit 1
          fi
          echo "Clean."

      - name: No .env or database dumps
        run: |
          if git ls-files | grep -E '^(.*/)?\.env$|\.sql$|\.sqlite3?$|\.db$|\.dump$' ; then
            echo "::error::Environment files or database dumps must not be committed. Add them to .gitignore."
            exit 1
          fi
          echo "Clean."

  deploy:
    name: Deploy to Render
    # Continuous Deployment, the brief's second option: this job starts only when all four
    # checks passed (needs), and only for a push to main (if). A pull request never deploys.
    needs: [python, postgres, node, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # The production environment lists every deploy, with its commit, on the repository's page.
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    steps:
      - name: Ask Render to deploy this commit
        # Each deploy hook is a secret URL from the Render service's settings, kept in GitHub
        # Secrets (Settings → Secrets and variables → Actions), never in the repository.
        # Render then builds main and switches to the new version only once its /health
        # answers 200; until then the version before keeps answering.
        env:
          API_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
          WEB_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
        run: |
          if [ -z "$API_HOOK" ] || [ -z "$WEB_HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_API or RENDER_DEPLOY_HOOK_WEB is not set: nothing deployed."
            exit 0
          fi
          curl -fsS -X POST "$API_HOOK" > /dev/null && echo "API deploy started for ${GITHUB_SHA::7}"
          curl -fsS -X POST "$WEB_HOOK" > /dev/null && echo "Web deploy started for ${GITHUB_SHA::7}"
          {
            echo "### Deploy started"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Web app: ${{ vars.APP_URL }}"
            echo "- The **Live check** workflow waits until \`/health\` reports this commit."
          } >> "$GITHUB_STEP_SUMMARY"
