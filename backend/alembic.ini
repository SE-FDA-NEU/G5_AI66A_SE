# Alembic settings. Run Alembic from the backend/ folder, for example `alembic upgrade head`.
#
# The database address is deliberately not written here: alembic/env.py reads DATABASE_URL from
# backend/.env, so every command uses the same database as the app and nothing secret is committed.
#
# Keep this file in plain ASCII: on Windows it is read with the system code page.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
